<bo-event-detail
	[name]="data()?.name?.trim()"
	[dateFrom]="data()?.dateFrom"
	[dates]="dates()"
	[water]="water()"
	[groups]="groups()"
	[leaders]="leaders()"
	[description]="albumSource()?.value()?.description ?? null"
	[summary]="data()?.report ?? null"
	[chronicle]="data()?.chronicle ?? null"
	[albumId]="data()?.album?._id ?? null"
	[photos]="photos()"
	[photosLoaded]="!!albumSource()?.value()"
	[photosFailed]="albumFailed()"
	[downloadHref]="downloadHref()"
	[failed]="failed()"
	failedTitle="Kronika nenalezena"
	failedText="Tuhle kroniku jsme nenašli."
/>
