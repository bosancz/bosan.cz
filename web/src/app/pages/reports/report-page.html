<bo-event-detail
	[name]="data()?.name?.trim()"
	[dateFrom]="data()?.dateFrom"
	[dates]="dates()"
	[water]="water()"
	[groups]="groups()"
	[leaders]="leaders()"
	[description]="albumSource()?.value()?.description ?? null"
	[summary]="data()?.summary ?? null"
	[chronicle]="data()?.chronicle ?? null"
	[albumId]="data()?.albumId?.toString() ?? null"
	[photos]="photos()"
	[photosLoaded]="photosLoaded()"
	[photosFailed]="albumFailed()"
	[downloadHref]="downloadHref()"
	[failed]="failed()"
	failedTitle="Kronika nenalezena"
	failedText="Tuhle kroniku jsme nenašli."
	[interniHref]="data() ? account.reportUrl(report()) : null"
/>
