<a class="card" [routerLink]="link()">
	<span class="thumb" [style.background]="cover()?.bg ?? null">
		@if (cover(); as photo) {
			@if (photo.sizes.small; as size) {
				<img
					[src]="size.url"
					[attr.width]="size.width"
					[attr.height]="size.height"
					alt=""
					[attr.loading]="eager() ? null : 'lazy'"
				/>
			}
		} @else if (!item().albumId) {
			<svg class="doc" aria-hidden="true" viewBox="0 0 24 24" width="56" height="56">
				<path
					d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"
					fill="none"
					stroke="currentColor"
					stroke-width="1.6"
					stroke-linecap="round"
					stroke-linejoin="round"
				/>
			</svg>
		}
		@if (badges().length) {
			<span class="badges">
				@for (badge of badges(); track badge) {
					<span class="badge">{{ badge }}</span>
				}
			</span>
		}
	</span>
	<span class="text">
		<span class="name">{{ name() | typography }}</span>
		<time class="date" [attr.datetime]="item().dateFrom.slice(0, 10)">{{ dates() }}</time>
	</span>
</a>
