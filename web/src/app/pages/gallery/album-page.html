<bo-event-detail
	[name]="data() ? name() : undefined"
	[dateFrom]="data()?.dateFrom"
	[dates]="dates()"
	[description]="data()?.description ?? null"
	[albumId]="album()"
	[photos]="photos()"
	[photosLoaded]="!!data()"
	[downloadHref]="downloadHref()"
	[failed]="failed()"
	failedTitle="Album nenalezeno"
	failedText="Album se nepodařilo načíst."
/>

@if (photo(); as photoId) {
	@if (photos().length) {
		<bo-photo-viewer [albumId]="album()" [albumName]="name()" [photos]="photos()" [photoId]="photoId" />
	}
}
