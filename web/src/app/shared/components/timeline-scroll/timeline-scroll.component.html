<div
     *ngFor="let item of visibleLabels"
     class="label"
     [style.top.px]="item.top"
     [class.text-right]="item.label.align === 'right'"
     [class.text-center]="item.label.align === 'center'"
     [class.text-left]="item.label.align === 'left'"
     >{{item.label.label}}</div>

<div class="visibleArea" [style.top]="visibleDim.from * 100 + '%'" [style.bottom]="(1 - visibleDim.to) * 100 + '%'"></div>
<div class="visibleMid" [style.top]="visibleDim.mid * 100 + '%'"></div>
