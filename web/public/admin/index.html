<!doctype html>
<html lang="cs">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Úprava webu · ŠÁN</title>
		<link rel="icon" href="/icons/favicon.ico" />
	</head>
	<body>
		<script>
			window.CMS_MANUAL_INIT = true;
			try {
				const key = "sveltia-cms.prefs";
				const prefs = JSON.parse(localStorage.getItem(key) ?? "{}");
				if (!prefs.bosanDefaults) {
					if (!prefs.theme || prefs.theme === "auto") prefs.theme = "dark";
					if (!prefs.locale || prefs.locale === "auto") prefs.locale = "cs";
					prefs.bosanDefaults = 1;
					localStorage.setItem(key, JSON.stringify(prefs));
				}
			} catch {}
		</script>
		<script src="https://unpkg.com/@sveltia/cms@0.250.2/dist/sveltia-cms.js"></script>
		<script>
			CMS.init({
				config: {
					backend: { base_url: location.origin },
					site_url: location.origin,
					display_url: location.origin,
				},
			});
		</script>
	</body>
</html>
