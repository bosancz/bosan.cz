name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      context:
        description: "Context for the Docker build"
        type: string
        required: true
      image-name:
        description: "Name of the published docker image"
        type: string
        required: true
      registry:
        description: "Container registry for the published docker image"
        type: string
        required: true
      tag:
        description: "Push under this tag"
        type: string
        required: false
      version:
        description: "Version to tag"
        type: string
        required: false
      build-args:
        description: "Build arguments"
        type: string
        required: false
      ref:
        description: "Git ref to check out and build (defaults to the triggering commit)"
        type: string
        required: false
    secrets:
      username:
        description: "Username for the container registry"
        required: true
      password:
        description: "Password for the container registry"
        required: true
    outputs:
      images:
        description: "List of pushed images, separated by commas"
        value: ${{ jobs.build.outputs.images }}

jobs:
  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.meta.outputs.images }}
    steps:
      - name: Checkout the updated source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          tags=()
          if [ -n "${{ inputs.tag }}" ]; then
            tags+=("${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.tag }}")
          fi
          if [ -n "${{ inputs.version }}" ]; then
            tags+=("${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.version }}")
          fi

          {
            echo "tags<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          images=$(IFS=,; echo "${tags[*]}")
          echo "images=$images" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
          build-args: ${{ inputs.build-args }}
