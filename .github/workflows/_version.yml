name: Resolve version

on:
  workflow_call:
    inputs:
      semver:
        description: "Version bump"
        required: true
        type: string
      prerelease:
        description: "Prerelease version"
        type: boolean
        required: false
        default: false
    outputs:
      new_tag:
        description: "Resolved version tag"
        value: ${{ jobs.version.outputs.new_tag }}
      new_sha:
        description: "Commit SHA carrying the resolved package.json version"
        value: ${{ jobs.version.outputs.new_sha }}

jobs:
  version:
    name: Resolve version tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      old_tag: ${{ steps.version.outputs.old_tag }}
      new_sha: ${{ steps.version.outputs.new_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: Set up Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Bump package.json version
        id: version
        run: |
          old_version="v$(node -p "require('./package.json').version")"
          echo "old_tag=$old_version" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.semver }}" = "none" ]; then
            new_version="$old_version"
          else
            bump="${{ inputs.semver }}"
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              bump="pre$bump"
            fi
            npm version --no-git-tag-version --preid=test "$bump" > /dev/null
            new_version="v$(node -p "require('./package.json').version")"
          fi
          echo "new_tag=$new_version" >> "$GITHUB_OUTPUT"

          if [ "$new_version" != "$old_version" ]; then
            git add package.json
            git commit -m "chore: bump version to $new_version"
            git push origin HEAD:${{ github.ref }}
          fi
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Print resolved tags
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          OLD_TAG: ${{ steps.version.outputs.old_tag }}
          BUMP: ${{ inputs.semver }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          echo "New tag: $NEW_TAG"
          echo "Old tag: $OLD_TAG"
          {
            echo "## Resolved version"
            echo
            echo "### \`$NEW_TAG\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Previous tag | \`$OLD_TAG\` |"
            echo "| Bump | \`$BUMP\` |"
            echo "| Prerelease | \`$PRERELEASE\` |"
          } >> "$GITHUB_STEP_SUMMARY"
